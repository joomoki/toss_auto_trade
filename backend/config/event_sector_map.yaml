# ── 이벤트 → 섹터 매핑 ────────────────────────────────────────────────────────
# weight > 0: 수혜, weight < 0: 피해, |weight| = 영향 강도 (0~1)
mappings:
  # 유가 상승
  - {event: oil_rise,      sector: energy,        weight:  0.90, rationale: "정유사 마진 확대"}
  - {event: oil_rise,      sector: shipbuilding,  weight:  0.40, rationale: "에너지 설비 발주 증가"}
  - {event: oil_rise,      sector: airline,       weight: -0.80, rationale: "항공유 비용 급등"}
  - {event: oil_rise,      sector: chemicals,     weight: -0.50, rationale: "원료비 상승"}

  # 유가 하락
  - {event: oil_fall,      sector: airline,       weight:  0.80, rationale: "항공유 비용 감소"}
  - {event: oil_fall,      sector: chemicals,     weight:  0.60, rationale: "원료비 하락 → 마진 개선"}
  - {event: oil_fall,      sector: energy,        weight: -0.90, rationale: "정유사 마진 감소"}

  # 원화 약세
  - {event: krw_weak,      sector: semiconductor, weight:  0.80, rationale: "달러 수출 이익 증가"}
  - {event: krw_weak,      sector: auto,          weight:  0.70, rationale: "수출 경쟁력 강화"}
  - {event: krw_weak,      sector: airline,       weight: -0.60, rationale: "달러 비용 증가"}
  - {event: krw_weak,      sector: growth,        weight: -0.30, rationale: "외국인 이탈"}

  # 원화 강세
  - {event: krw_strong,    sector: airline,       weight:  0.50, rationale: "달러 비용 감소"}
  - {event: krw_strong,    sector: semiconductor, weight: -0.60, rationale: "수출 마진 축소"}
  - {event: krw_strong,    sector: auto,          weight: -0.50, rationale: "수출 경쟁력 약화"}

  # 금리 상승
  - {event: rate_rise,     sector: finance,       weight:  0.80, rationale: "NIM 확대"}
  - {event: rate_rise,     sector: growth,        weight: -0.80, rationale: "할인율 상승 → PER 압축"}
  - {event: rate_rise,     sector: construction,  weight: -0.70, rationale: "금융비용 증가"}
  - {event: rate_rise,     sector: beauty,        weight: -0.30, rationale: "소비 위축"}

  # 금리 하락
  - {event: rate_fall,     sector: growth,        weight:  0.80, rationale: "할인율 하락 → 성장주 재평가"}
  - {event: rate_fall,     sector: construction,  weight:  0.70, rationale: "부동산 회복"}
  - {event: rate_fall,     sector: beauty,        weight:  0.30, rationale: "소비 회복"}
  - {event: rate_fall,     sector: finance,       weight: -0.50, rationale: "NIM 축소"}

  # 지정학 리스크
  - {event: geopolitical,  sector: defense,       weight:  0.95, rationale: "방산 수요 직접 수혜"}
  - {event: geopolitical,  sector: gold_materials,weight:  0.60, rationale: "안전자산 선호"}
  - {event: geopolitical,  sector: airline,       weight: -0.70, rationale: "여행 수요 급감"}
  - {event: geopolitical,  sector: growth,        weight: -0.50, rationale: "리스크 오프"}

  # 인플레이션 상승
  - {event: inflation_high,sector: energy,        weight:  0.60, rationale: "에너지 가격 상승"}
  - {event: inflation_high,sector: gold_materials,weight:  0.50, rationale: "실물자산 선호"}
  - {event: inflation_high,sector: growth,        weight: -0.60, rationale: "금리 인상 압력"}
  - {event: inflation_high,sector: construction,  weight: -0.40, rationale: "원자재 비용 상승"}

  # 정책
  - {event: policy_defense,      sector: defense,       weight:  0.90, rationale: "방산 정책 직접 수혜"}
  - {event: policy_nuclear,      sector: nuclear,       weight:  0.90, rationale: "원전 정책 직접 수혜"}
  - {event: policy_value_up,     sector: finance,       weight:  0.70, rationale: "저PBR 금융주 부각"}
  - {event: policy_value_up,     sector: auto,          weight:  0.60, rationale: "현대차/기아 주주환원"}
  - {event: policy_semiconductor,sector: semiconductor,  weight:  0.80, rationale: "정부 지원 직접 수혜"}
  - {event: policy_beauty,       sector: beauty,        weight:  0.90, rationale: "K-뷰티 수요 회복"}
