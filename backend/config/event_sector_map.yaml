version: "1.0"
updated: "2026-06-22"

# ── 이벤트 정의 ─────────────────────────────────────────────────────────────
events:
  oil_rise:
    name: 유가 상승
    thresholds: {daily_pct: 3.0, five_day_pct: 8.0}
    assets: ["CL=F", "BZ=F"]
    category: market

  oil_fall:
    name: 유가 하락
    thresholds: {daily_pct: -3.0, five_day_pct: -8.0}
    assets: ["CL=F", "BZ=F"]
    category: market

  krw_weak:
    name: 원화 약세
    thresholds: {daily_pct: 0.7, level: 1400}
    assets: ["KRW=X"]
    category: market

  krw_strong:
    name: 원화 강세
    thresholds: {daily_pct: -0.7, level: 1300}
    assets: ["KRW=X"]
    category: market

  rate_rise:
    name: 금리 상승
    thresholds: {daily_bp: 5}
    assets: ["^TNX"]
    keywords: ["금리인상", "기준금리 인상", "금통위 인상", "hawkish"]
    category: market

  rate_fall:
    name: 금리 하락
    thresholds: {daily_bp: -5}
    assets: ["^TNX"]
    keywords: ["금리인하", "피벗", "완화", "dovish"]
    category: market

  geopolitical:
    name: 지정학 리스크
    thresholds: {vix_level: 25, vix_change_pct: 15}
    assets: ["^VIX", "GC=F"]
    keywords: ["전쟁", "분쟁", "미사일", "도발", "지정학", "긴장", "충돌", "침공"]
    category: risk

  inflation_high:
    name: 인플레이션 상승
    thresholds: {}
    assets: []
    keywords: ["CPI 상회", "물가 급등", "인플레", "PPI 상승", "물가상승"]
    category: macro

  policy_defense:
    name: 방산 정책
    thresholds: {}
    assets: []
    keywords: ["방산", "방위산업", "K-방산", "무기수출", "국방예산", "방산수출"]
    category: policy

  policy_nuclear:
    name: 원전 정책
    thresholds: {}
    assets: []
    keywords: ["원전", "원자력", "SMR", "핵발전", "소형원자로", "원전건설"]
    category: policy

  policy_value_up:
    name: 밸류업 정책
    thresholds: {}
    assets: []
    keywords: ["밸류업", "주주환원", "저PBR", "기업가치제고", "배당확대"]
    category: policy

  policy_semiconductor:
    name: 반도체 지원 정책
    thresholds: {}
    assets: []
    keywords: ["반도체지원", "반도체특별법", "K-반도체", "소부장", "반도체클러스터"]
    category: policy

  policy_beauty:
    name: K-뷰티 수요 회복
    thresholds: {}
    assets: []
    keywords: ["K-뷰티", "화장품수출", "중국관광", "따이공", "면세회복"]
    category: policy

