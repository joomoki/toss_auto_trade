version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: toss_postgres
    environment:
      POSTGRES_DB: toss_auto_trade
      POSTGRES_USER: toss_stock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toss_stock -d toss_auto_trade"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: toss_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toss_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://toss_stock:${POSTGRES_PASSWORD:-changeme}@postgres:5432/toss_auto_trade
      REDIS_URL: redis://redis:6379/0
      TOSS_API_KEY: ${TOSS_API_KEY}
      TOSS_API_SECRET: ${TOSS_API_SECRET}
      TOSS_ACCOUNT_NO: ${TOSS_ACCOUNT_NO}
      AUTO_TRADE_ENABLED: ${AUTO_TRADE_ENABLED:-false}
      SIGNAL_INTERVAL_MINUTES: ${SIGNAL_INTERVAL_MINUTES:-5}
      MAX_HOLDINGS: ${MAX_HOLDINGS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/models:/app/app/ml/models

volumes:
  postgres_data:
